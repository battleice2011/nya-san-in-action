<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#83d9f4"><meta name="description" content="魔法少女にゃーさん in Action — 猫耳魔法少女の爽快アクション">
<title>魔法少女にゃーさん in Action</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game-shell">
  <canvas id="game" aria-label="魔法少女にゃーさん in Action"></canvas>
  <section id="title-screen" class="screen title-screen-image">
    <div class="title-visual-wrap">
      <img class="title-visual" src="assets/title_screen.png" alt="魔法少女にゃーさん in Action" draggable="false">
      <div class="title-start-area">
        <button id="start-button">ゲームスタート <span>▶</span></button>
        <p class="hint">移動 ◀ ▶　ジャンプ ▲　魔法攻撃 ✦</p>
      </div>
    </div>
  </section>
  <section id="result-screen" class="screen hidden"><div class="title-card result-card"><p class="eyebrow">QUEST RESULT</p><h2 id="result-title">STAGE CLEAR!</h2><p id="result-text">スライムを倒した！</p><button id="restart-button">もう一度あそぶ ↻</button></div></section>
  <div id="hud" class="hidden"><div class="hud-left"><div class="hud-label">HP</div><div class="hp-track"><div id="hp-fill"></div></div><div id="hp-text">♥ ♥ ♥</div></div><div class="hud-center"><span class="stage-pill">STAGE 01</span><span id="score">✦ 0000</span></div><div class="hud-right"><span id="enemy-count">ENEMIES × 12</span></div></div>
  <div id="touch-controls" class="hidden">
    <div class="move-pad"><button data-control="left" aria-label="左へ">◀</button><button data-control="right" aria-label="右へ">▶</button></div>
    <div class="action-pad"><button data-control="jump" class="jump" aria-label="ジャンプ">▲<small>JUMP</small></button><button data-control="attack" class="attack" aria-label="魔法攻撃">✦<small>MAGIC</small></button></div>
  </div>
  <div id="toast" class="hidden"></div>
</main>
<script src="game.js"></script>
</body></html>
